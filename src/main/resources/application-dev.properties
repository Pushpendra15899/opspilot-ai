# Local development profile.
# Safe, non-sensitive defaults so the app runs out of the box against a
# locally installed PostgreSQL instance. Override any of these via
# environment variables (or an untracked application-local.properties) instead
# of editing this file.
app.environment=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
spring.datasource.username=${DB_USERNAME:pushpendramukati}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true

# Full health component details (db, diskSpace, etc.) are convenient locally
# but should not be exposed unauthenticated in production - see application-prod.properties.
management.endpoint.health.show-details=always