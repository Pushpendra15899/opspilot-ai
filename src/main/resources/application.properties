spring.application.name=opspilot-ai
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=validate

# HikariCP pool sizing, made explicit rather than left as implicit defaults so
# it's documented and visible instead of hidden. These values match Spring
# Boot/HikariCP's own built-in defaults - no behavior change from before.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# Readiness reflects whether the app can actually serve traffic, including the
# database it depends on, so Kubernetes stops routing to a pod that can't reach
# Postgres. Liveness intentionally stays decoupled from "db" so a database
# outage doesn't trigger container restarts on top of the outage.
management.endpoint.health.group.readiness.include=readinessState,db
# The root /actuator/health endpoint intentionally hides component detail in
# prod (show-details=when-authorized in application-prod.properties) since
# there's no auth layer to ever be "authorized" under - so it never leaks
# anything, but it also never shows the operations dashboard which component
# is failing. This "dashboard" group is a narrow, explicit exception: it
# exposes only "db" and "diskSpace" detail (product name / byte counts - no
# credentials, hosts, or connection strings) at /actuator/health/dashboard,
# for the frontend Observability page's per-component panel. The aggregate
# status at the root /actuator/health endpoint is unaffected either way - it
# already reflects db health regardless of show-details.
management.endpoint.health.group.dashboard.include=db,diskSpace
management.endpoint.health.group.dashboard.show-details=always
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET

logging.structured.format.console=ecs

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
