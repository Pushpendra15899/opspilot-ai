# Production profile.
# No credential defaults here on purpose: DB_URL, DB_USERNAME and DB_PASSWORD
# must be supplied as environment variables (or a secret store injecting
# environment variables). The application fails fast on startup if they are
# missing, rather than silently falling back to a local development value.
app.environment=prod

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Hide health component details (db status, disk space, etc.) from
# unauthenticated callers. The aggregate UP/DOWN status is still always
# returned, so PostgreSQL outages are still reflected in /actuator/health.
management.endpoint.health.show-details=when-authorized