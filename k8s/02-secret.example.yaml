# Template only - do not apply this file directly and never commit real values here.
#
# The real Secret is created imperatively so no credential value is ever
# written to disk in this repo:
#
#   kubectl create secret generic opspilot-db-credentials \
#     -n opspilot \
#     --from-literal=DB_USERNAME=opspilot \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 18)"
#
# In a real deployment this Secret object would instead be created by
# External Secrets Operator / AWS Secrets Manager CSI driver (pulling from
# AWS Secrets Manager) or by a GitOps-friendly sealed-secrets controller -
# the Deployments below only reference the Secret by name and key, so
# swapping how it's populated requires no application or Deployment changes.
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-db-credentials
  namespace: opspilot
type: Opaque
stringData:
  DB_USERNAME: changeme
  DB_PASSWORD: changeme
