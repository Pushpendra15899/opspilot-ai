apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
  namespace: opspilot
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_URL: "jdbc:postgresql://opspilot-db:5432/opspilot"
  # Comma-separated - WebConfig.java splits this into a list of allowed
  # origins. :3000 is the Docker-Compose/Nginx-served frontend; :5173 is the
  # local Vite dev server (npm run dev), used when developing against this
  # Kubernetes-hosted backend via kubectl port-forward.
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
  POSTGRES_DB: "opspilot"
