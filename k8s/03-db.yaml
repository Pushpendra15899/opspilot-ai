apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opspilot-db-data
  namespace: opspilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Local dev sizing only - not a statement about production capacity.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-db
  namespace: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-db
  template:
    metadata:
      labels:
        app: opspilot-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: opspilot-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opspilot-db-credentials
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opspilot-db-credentials
                  key: DB_PASSWORD
            # Postgres initdb refuses to run if its data directory is
            # non-empty (some volume/CSI drivers seed hidden entries like
            # lost+found at the mount root). Pointing PGDATA at a subdirectory
            # of the mount avoids that regardless of the underlying storage
            # backend.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opspilot-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-db
  namespace: opspilot
spec:
  selector:
    app: opspilot-db
  ports:
    - port: 5432
      targetPort: 5432
